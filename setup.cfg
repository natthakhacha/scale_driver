[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short

[coverage:run]
source = scale_driver
omit = 
    */tests/*
    */examples/*
    setup.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
